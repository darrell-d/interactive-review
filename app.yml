# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
# What this app is, for the app store and the workflow builder.
schemaVersion: "1.0"
application:
  name: Organize files
  description: >-
    Pauses the workflow so a person can rename and rearrange the files it was
    given, in their browser, like a file manager. Nothing is moved: the step's
    output is a manifest of what they did, as instructions (create folder,
    rename, move) for a later step to execute.
  type: processor
  tags: [interactive, files, organize]

runtime:
  cpu: 1024
  memory: 2048
  # A live session, not a batch step: the workflow pauses while it runs and
  # the user reaches it through the auth proxy.
  interactive: true
  # The kind of live session (webapp: a web page the app serves itself).
  sessionType: webapp
  computeTypes: [standard]

parameters:
  - name: IDLE_TIMEOUT_SECONDS
    type: integer
    description: >-
      Close the session, and fail the step, after this many seconds without a
      request from the person's browser.
    defaultValue: 3600
    required: false

inputs:
  - name: files
    description: >-
      The files to organize: a previous step's, or files and folders chosen
      for the run. A chosen folder arrives with what's in it.

# Written to its own folder, OUTPUT_DIR/manifest/.
outputs:
  - name: manifest
    description: >-
      manifest.json: "operations" is what the person did, in order (create
      folder, rename, move), for another app to execute; "files" is where every
      file should be once that's done; "notes" is what the person wrote.
    mediaTypes: [application/json]
